<!-- GSAPP27 PATCH v3: Notices move, deadline logic, tab scroll fix -->
<style>
  /* 1. Top tab menu: keep original colors, but prevent Museum from overflowing */
  .tab-nav-inner {
    max-width: 680px;
    margin: 0 auto;
    display: flex;
    gap: 2px;
    padding: 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }

  .tab-nav-inner::-webkit-scrollbar {
    display: none;
  }

  .tab-btn {
    flex: 0 0 auto !important;
    min-width: 132px;
    white-space: nowrap;
  }

  @media (max-width: 560px) {
    .tab-btn {
      min-width: 118px;
      font-size: 12px;
      padding-left: 10px;
      padding-right: 10px;
    }
  }

  /* 2. Notices tab layout */
  .notice-wrap {
    padding: 20px 14px 60px;
    max-width: 680px;
    margin: 0 auto;
  }

  .notice-hero {
    background: var(--blue);
    border-radius: var(--radius);
    padding: 20px 18px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }

  .notice-hero::after {
    content: '';
    position: absolute;
    right: -20px;
    bottom: -30px;
    width: 120px;
    height: 120px;
    background: var(--orange);
    border-radius: 50%;
    opacity: .2;
  }

  .notice-hero-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--orange);
    margin-bottom: 6px;
  }

  .notice-hero h2 {
    font-size: 20px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }

  .notice-hero p {
    font-size: 12px;
    color: rgba(255,255,255,.6);
  }

  .notice-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 2px solid var(--blue);
    box-shadow: var(--shadow);
    margin-bottom: 14px;
    overflow: hidden;
  }

  .notice-card.notice-card-orange {
    border-color: var(--orange);
  }

  .notice-card.past {
    background: #F8F9FA;
    border-color: #D1D9E8;
    color: #9AA3BF;
  }

  .notice-card-top {
    padding: 16px 18px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .notice-type {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--blue);
    margin-bottom: 10px;
  }

  .notice-type.orange {
    color: var(--orange);
  }

  .notice-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .notice-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--text);
    line-height: 1.25;
  }

  .notice-subtitle {
    font-size: 13px;
    color: var(--text-3);
    margin-top: 8px;
    line-height: 1.45;
  }

  .notice-date {
    text-align: right;
    flex-shrink: 0;
    min-width: 82px;
  }

  .notice-date-main {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-2);
    white-space: nowrap;
  }

  .notice-days {
    font-size: 13px;
    font-weight: 800;
    margin-top: 6px;
    color: var(--orange);
    white-space: nowrap;
  }

  .notice-card.past .notice-title,
  .notice-card.past .notice-subtitle,
  .notice-card.past .notice-date-main,
  .notice-card.past .notice-days,
  .notice-card.past .notice-type {
    color: #9AA3BF;
  }

  /* 3. Assignment past area */
  .past-separator {
    margin: 22px 14px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .past-separator-line {
    flex: 1;
    height: 1px;
    background: #D1D9E8;
  }

  .past-separator-label {
    font-size: 10px;
    font-weight: 800;
    color: #9AA3BF;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .assignment-past-card {
    background: #F8F9FA !important;
    border: 1px solid #E8ECF4 !important;
    box-shadow: none !important;
  }

  .assignment-past-card .task-name,
  .assignment-past-card .card-name,
  .assignment-past-card .due-date,
  .assignment-past-card .due-days,
  .assignment-past-card .task-detail {
    color: #9AA3BF !important;
  }
</style>

<script>
(function () {
  'use strict';

  const PATCH_NOTICES = [
    {
      id: 'notice-rep-election',
      type: 'GSAPP NOTICE',
      title: 'UD Student Rep Election 26-27',
      subtitle: 'Apply by Fri Jun 12 · 10AM',
      date: '2026-06-12',
      dueTime: '10:00',
      color: 'blue',
      isNew: true
    },
    {
      id: 'notice-alumni-lecture',
      type: 'GSAPP EVENT',
      title: 'Distinguished Alumni Lecture',
      subtitle: 'Max Nuñez · Thu Jun 11 · Casa Italiana',
      date: '2026-06-11',
      dueTime: '18:30',
      color: 'blue',
      isNew: true
    },
    {
      id: 'notice-avery-archive',
      type: 'NOTICE',
      title: 'Avery Drawings & Archives Visit',
      subtitle: 'Wed Jun 3 · 2-4PM · Arrive at your allotted time slot',
      date: '2026-06-03',
      dueTime: '18:00',
      color: 'orange',
      isNew: true
    },
    {
      id: 'notice-cuid',
      type: 'MUSEUM ACCESS',
      title: 'CUID Validation Sticker Required',
      subtitle: 'Free admission often requires the current semester validation sticker on your CUID.',
      date: null,
      dueTime: null,
      color: 'orange',
      isNew: false
    },
    {
      id: 'notice-ops',
      type: 'OUTPUT SHOP',
      title: 'OPS Self-Plotting Reminder',
      subtitle: 'Use file name format: UNI - SIZE - PAPER TYPE. Payment uses Flex Account only.',
      date: null,
      dueTime: null,
      color: 'blue',
      isNew: false
    }
  ];

  function parseDueDateTime(dateString, dueTime) {
    if (!dateString) return null;

    const time = dueTime || '18:00';
    const parts = time.split(':');
    const hour = Number(parts[0] || 18);
    const minute = Number(parts[1] || 0);

    const due = new Date(dateString + 'T00:00:00');
    due.setHours(hour, minute, 0, 0);
    return due;
  }

  function startOfDay(date) {
    const d = new Date(date);
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function getDaysLeft(dateString, dueTime) {
    const due = parseDueDateTime(dateString, dueTime);
    if (!due) return 9999;

    const now = new Date();

    if (now >= due) return -1;

    const today = startOfDay(now);
    const dueDay = startOfDay(due);

    return Math.round((dueDay - today) / 86400000);
  }

  function formatDate(dateString) {
    if (!dateString) return '';
    return new Date(dateString + 'T00:00:00').toLocaleDateString('en-US', {
      month: 'short',
      day: 'numeric'
    });
  }

  function formatDays(days) {
    if (days === 9999) return '';
    if (days < 0) return 'Past';
    if (days === 0) return 'TODAY';
    if (days === 1) return '1 day left';
    return days + ' days left';
  }

  function insertNoticesTab() {
    const tabInner = document.querySelector('.tab-nav-inner');
    const scheduleBtn = Array.from(document.querySelectorAll('.tab-btn')).find(function (btn) {
      return btn.textContent.trim().toLowerCase().includes('schedule');
    });

    if (!tabInner || !scheduleBtn) return;

    const alreadyExists = Array.from(document.querySelectorAll('.tab-btn')).some(function (btn) {
      return btn.textContent.trim().toLowerCase().includes('notice');
    });

    if (!alreadyExists) {
      const noticeBtn = document.createElement('button');
      noticeBtn.className = 'tab-btn';
      noticeBtn.type = 'button';
      noticeBtn.setAttribute('onclick', "switchTab('notices', this)");
      noticeBtn.innerHTML = '<span style="font-size:15px;">🔊</span> Notices';
      scheduleBtn.insertAdjacentElement('afterend', noticeBtn);
    }

    const noticesPanelExists = document.getElementById('tab-notices');
    if (!noticesPanelExists) {
      const schedulePanel = document.getElementById('tab-schedule');
      const panel = document.createElement('div');
      panel.id = 'tab-notices';
      panel.className = 'tab-panel';
      panel.innerHTML =
        '<div class="notice-wrap">' +
          '<div class="notice-hero">' +
            '<div class="notice-hero-label">GSAPP Updates</div>' +
            '<h2>Notices</h2>' +
            '<p>Program reminders, event notes, and access information in one place.</p>' +
          '</div>' +
          '<div id="notice-list"></div>' +
        '</div>';

      if (schedulePanel) {
        schedulePanel.insertAdjacentElement('afterend', panel);
      } else {
        document.querySelector('main').prepend(panel);
      }
    }
  }

  function renderNotices() {
    const list = document.getElementById('notice-list');
    if (!list) return;

    const dated = PATCH_NOTICES
      .filter(function (item) { return item.date; })
      .map(function (item) {
        return Object.assign({}, item, { days: getDaysLeft(item.date, item.dueTime) });
      });

    const undated = PATCH_NOTICES
      .filter(function (item) { return !item.date; })
      .map(function (item) {
        return Object.assign({}, item, { days: 9999 });
      });

    const upcoming = dated
      .filter(function (item) { return item.days >= 0; })
      .sort(function (a, b) {
        return parseDueDateTime(a.date, a.dueTime) - parseDueDateTime(b.date, b.dueTime);
      });

    const past = dated
      .filter(function (item) { return item.days < 0; })
      .sort(function (a, b) {
        return parseDueDateTime(b.date, b.dueTime) - parseDueDateTime(a.date, a.dueTime);
      });

    const all = upcoming.concat(undated).concat(past);

    list.innerHTML = all.map(function (item) {
      const isPast = item.days < 0;
      const isOrange = item.color === 'orange';
      const cardClass = 'notice-card' + (isOrange ? ' notice-card-orange' : '') + (isPast ? ' past' : '');
      const typeClass = 'notice-type' + (isOrange ? ' orange' : '');
      const dateHtml = item.date
        ? '<div class="notice-date">' +
            '<div class="notice-date-main">' + formatDate(item.date) + '</div>' +
            '<div class="notice-days">' + formatDays(item.days) + '</div>' +
          '</div>'
        : '';

      return '<div class="' + cardClass + '">' +
        '<div class="notice-card-top">' +
          '<div>' +
            '<div class="' + typeClass + '">' +
              '<span class="notice-dot"></span>' +
              '<span>📢 ' + item.type + '</span>' +
            '</div>' +
            '<div class="notice-title">' + item.title + (item.isNew ? ' <span class="new-badge">NEW</span>' : '') + '</div>' +
            '<div class="notice-subtitle">' + item.subtitle + '</div>' +
          '</div>' +
          dateHtml +
        '</div>' +
      '</div>';
    }).join('');
  }

  function removeNoticeItemsFromAssignments() {
    const keywords = [
      'UD Student Rep Election 26-27',
      'Distinguished Alumni Lecture'
    ];

    keywords.forEach(function (keyword) {
      document.querySelectorAll('.card, .task-item').forEach(function (el) {
        if (el.textContent && el.textContent.includes(keyword)) {
          const next = el.nextElementSibling;
          if (next && next.classList.contains('task-expand')) next.remove();
          el.remove();
        }
      });
    });

    try {
      if (typeof allTasks !== 'undefined' && Array.isArray(allTasks)) {
        for (let i = allTasks.length - 1; i >= 0; i--) {
          const label = allTasks[i].label || allTasks[i].title || '';
          if (keywords.some(function (keyword) { return label.includes(keyword); })) {
            allTasks.splice(i, 1);
          }
        }
      }
    } catch (err) {
      console.warn('allTasks patch skipped:', err);
    }
  }

  function fixAveryArchiveDate() {
    document.querySelectorAll('.card, .task-item').forEach(function (el) {
      if (el.textContent && el.textContent.includes('Avery Drawings & Archives Visit')) {
        el.innerHTML = el.innerHTML
          .replace(/Jun 4/g, 'Jun 3')
          .replace(/Wed Jun 4/g, 'Wed Jun 3')
          .replace(/1d left/g, 'Past')
          .replace(/1 day left/g, 'Past');
      }
    });

    try {
      if (typeof allTasks !== 'undefined' && Array.isArray(allTasks)) {
        allTasks.forEach(function (task) {
          const label = task.label || task.title || '';
          if (label.includes('Avery Drawings & Archives Visit')) {
            task.date = '2026-06-03';
            task.dueTime = '18:00';
            task.detail = 'Wed Jun 3 · 2-4PM · Arrive at your allotted time slot';
          }
        });
      }
    } catch (err) {
      console.warn('Avery date patch skipped:', err);
    }
  }

  function buildPatchedUpcoming() {
    const list = document.getElementById('upcoming-list');
    if (!list) return;

    let source = [];

    try {
      if (typeof allTasks !== 'undefined' && Array.isArray(allTasks)) {
        source = allTasks.slice();
      }
    } catch (err) {
      source = [];
    }

    if (!source.length) return;

    source = source
      .filter(function (task) {
        const label = task.label || task.title || '';
        return !label.includes('UD Student Rep Election 26-27') &&
               !label.includes('Distinguished Alumni Lecture');
      })
      .map(function (task) {
        const dueTime = task.dueTime || '18:00';
        return Object.assign({}, task, {
          dueTime: dueTime,
          days: getDaysLeft(task.date, dueTime)
        });
      });

    const upcoming = source
      .filter(function (task) { return task.days >= 0 && task.days <= 10; })
      .sort(function (a, b) {
        return parseDueDateTime(a.date, a.dueTime) - parseDueDateTime(b.date, b.dueTime);
      });

    const past = source
      .filter(function (task) { return task.days < 0; })
      .sort(function (a, b) {
        return parseDueDateTime(b.date, b.dueTime) - parseDueDateTime(a.date, a.dueTime);
      });

    function card(task, isPast) {
      const title = task.label || task.title || 'Untitled';
      const detail = task.detail || task.subtitle || '';
      const course = task.course || '';
      const date = formatDate(task.date);
      const daysLabel = isPast ? 'Completed' : formatDays(task.days);
      const color = isPast ? '#B0B8CC' : (task.color || 'var(--blue)');
      const pastClass = isPast ? ' assignment-past-card' : '';
      const click = !isPast && task.subTab && task.taskId
        ? ' onclick="goToTask(\'' + task.subTab + '\', \'' + task.taskId + '\')"'
        : '';

      return '<div class="card' + pastClass + '" style="margin:0 14px 8px;cursor:pointer;"' + click + '>' +
        '<div class="card-top" style="padding:12px 14px 10px;">' +
          '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;">' +
            '<div>' +
              '<div style="display:flex;align-items:center;gap:7px;margin-bottom:4px;">' +
                '<span style="width:8px;height:8px;border-radius:50%;background:' + color + ';flex-shrink:0;display:inline-block;"></span>' +
                '<span style="font-size:10px;font-weight:800;color:' + color + ';text-transform:uppercase;letter-spacing:.5px;">' + course + '</span>' +
              '</div>' +
              '<div class="task-name" style="font-size:14px;font-weight:700;color:var(--text);">' + title + '</div>' +
              '<div class="task-detail" style="font-size:11px;color:var(--text-3);margin-top:2px;">' + detail + '</div>' +
            '</div>' +
            '<div style="text-align:right;flex-shrink:0;">' +
              '<div class="due-date" style="font-size:12px;font-weight:700;color:var(--text-2);">' + date + '</div>' +
              '<div class="due-days" style="font-size:11px;font-weight:700;margin-top:2px;color:' + (isPast ? '#9AA3BF' : 'var(--orange)') + ';">' + daysLabel + '</div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    let html = '';

    if (upcoming.length) {
      html += upcoming.map(function (task) { return card(task, false); }).join('');
    } else {
      html += '<div style="text-align:center;padding:32px 24px 8px;color:var(--text-3);font-size:13px;">No deadlines in the next 10 days 🎉</div>';
    }

    if (past.length) {
      html += '<div class="past-separator">' +
        '<div class="past-separator-line"></div>' +
        '<div class="past-separator-label">Completed / Past</div>' +
        '<div class="past-separator-line"></div>' +
      '</div>';

      html += past.map(function (task) { return card(task, true); }).join('');
    }

    list.innerHTML = html;
  }

  function patchSwitchTabScroll() {
    const oldSwitchTab = window.switchTab;

    window.switchTab = function (tab, btn) {
      if (typeof oldSwitchTab === 'function') {
        oldSwitchTab(tab, btn);
      } else {
        document.querySelectorAll('.tab-panel').forEach(function (panel) {
          panel.classList.remove('active');
        });

        const target = document.getElementById('tab-' + tab);
        if (target) target.classList.add('active');

        document.querySelectorAll('.tab-btn').forEach(function (button) {
          button.classList.remove('active');
        });

        if (btn) btn.classList.add('active');
      }

      if (btn && typeof btn.scrollIntoView === 'function') {
        btn.scrollIntoView({
          behavior: 'smooth',
          inline: 'center',
          block: 'nearest'
        });
      }
    };
  }

  function runPatch() {
    insertNoticesTab();
    patchSwitchTabScroll();
    fixAveryArchiveDate();
    removeNoticeItemsFromAssignments();
    renderNotices();
    buildPatchedUpcoming();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runPatch);
  } else {
    runPatch();
  }
})();
</script>
